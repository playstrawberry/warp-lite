[package]
name = "warp-lite"
version = "0.1.0"
edition = "2024"
license = "LicenseRef-Strawberry-Source-Available-1.0"
publish = false
authors = ["Strawberry Interactive LLC"]
description = "Standalone, permission-checked server warps."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sp-travel = { path = "libs/sp-travel" }
strawberry-plugin-api = { version = "=0.2.3", registry = "strawberry" }

# A repository of its own, not a member of a larger workspace.
[workspace]
members = ["libs/sp-travel"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
